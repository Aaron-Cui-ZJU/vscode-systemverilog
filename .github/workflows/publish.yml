name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump before publishing'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Update changelog
        run: node scripts/update-changelog.js

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx --yes @vscode/vsce publish --no-dependencies
          elif [ "${{ inputs.bump }}" = "none" ]; then
            npx --yes @vscode/vsce publish --no-dependencies
          else
            npx --yes @vscode/vsce publish "${{ inputs.bump }}" --no-dependencies
          fi

      # Optional: publish to Open VSX (VSCodium). Uncomment and set OVSX_PAT.
      # - name: Publish to Open VSX
      #   if: env.OVSX_PAT != ''
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      #   run: npx --yes ovsx publish -p "$OVSX_PAT"
